<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粒子知识图谱壁纸</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0f;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
    }

    /* 右上角控制面板，仅桌面调试用 */
    .panel {
      position: fixed;
      top: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.4s;
    }

    .panel:hover,
    .panel.visible {
      opacity: 1;
    }

    .panel label {
      color: rgba(255, 255, 255, 0.7);
      font-family: 'Segoe UI', sans-serif;
      font-size: 12px;
      user-select: none;
    }

    .panel input[type="range"] {
      width: 120px;
      accent-color: rgba(100, 180, 255, 0.8);
    }

    .panel input[type="number"] {
      width: 50px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      color: #fff;
      padding: 2px 6px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <canvas id="c"></canvas>

  <!-- 调试面板（鼠标移到右上角显示） -->
  <div class="panel" id="panel">
    <label>粒子数 <input type="range" id="countSlider" min="30" max="300" value="120" step="10">
      <input type="number" id="countInput" value="120" min="30" max="300">
    </label>
    <label>连线距离 <input type="range" id="distSlider" min="50" max="300" value="150" step="10"></label>
    <label>鼠标引力 <input type="range" id="forceSlider" min="0" max="100" value="60" step="5"></label>
    <label>粒子速度 <input type="range" id="speedSlider" min="10" max="200" value="100" step="10"></label>
    <label>随机游走 <input type="range" id="driftSlider" min="0" max="100" value="70" step="5"></label>
    <label>点大小 <input type="range" id="sizeSlider" min="1" max="6" value="2" step="0.5"></label>
    <label>颜色方案
      <select id="colorSelect">
        <option value="cyan">青蓝</option>
        <option value="gold">金橙</option>
        <option value="green">翠绿</option>
        <option value="purple">紫罗兰</option>
        <option value="rainbow">彩虹</option>
      </select>
    </label>
    <label style="margin-top:4px">
      <input type="checkbox" id="trailCheck"> 拖尾淡影
    </label>
  </div>

  <script>
    (function () {
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');

      // ─── 可调参数 ───
      let PARTICLE_COUNT = 120;
      let CONNECT_DIST = 150;
      let MOUSE_FORCE = 60;   // 0~100
      let BASE_SPEED = 1.0;
      let DRIFT_FORCE = 5.5;  // 随机游走强度 (0~1)
      let POINT_SIZE = 2.0;
      let COLOR_SCHEME = 'cyan';
      let TRAIL_MODE = false;

      // ─── 颜色方案 ───
      const colorSchemes = {
        cyan: { r: 100, g: 200, b: 255 },
        gold: { r: 255, g: 180, b: 80 },
        green: { r: 100, g: 255, b: 150 },
        purple: { r: 180, g: 120, b: 255 },
        rainbow: null, // 彩虹模式：每个粒子单独颜色
      };

      // ─── 粒子存储 ───
      let particles = [];
      let w, h;

      // ─── 鼠标 ───
      let mouse = { x: -9999, y: -9999, active: false };

      // ─── 初始化粒子 ───
      function createParticles(count) {
        const arr = [];
        for (let i = 0; i < count; i++) {
          const hue = Math.random() * 360;
          arr.push({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * BASE_SPEED * 2,
            vy: (Math.random() - 0.5) * BASE_SPEED * 2,
            ax: 0,
            ay: 0,
            hue: hue,          // 彩虹模式用
            baseHue: hue,      // 保存原始色相
            size: POINT_SIZE + Math.random() * 1.5,
          });
        }
        return arr;
      }

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        // 重设粒子位置范围
        for (const p of particles) {
          p.x = Math.min(p.x, w);
          p.y = Math.min(p.y, h);
        }
      }

      // ─── 主循环 ───
      function update() {
        const forceFactor = MOUSE_FORCE / 100;
        const speedFactor = BASE_SPEED;

        for (const p of particles) {
          // 鼠标引力/斥力（近距排斥，中距吸引，远距无影响）
          if (mouse.active) {
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const repelDist = 80;        // 80px 内排斥
            const attractMax = CONNECT_DIST * 1.5;
            if (dist < attractMax && dist > 0.5) {
              const nx = dx / dist;
              const ny = dy / dist;
              let force = 0;
              if (dist < repelDist) {
                // 排斥：距离越近斥力越大
                force = -0.15 * forceFactor * (1 - dist / repelDist);
              } else {
                // 吸引：峰值在中间距离
                const t = (dist - repelDist) / (attractMax - repelDist);
                force = 0.06 * forceFactor * t * (1 - t) * 4; // 抛物线，中间最强
              }
              p.ax += nx * force;
              p.ay += ny * force;
            }
          }

          // 随机游走（布朗运动）
          const drift = DRIFT_FORCE * 0.06;
          p.ax += (Math.random() - 0.5) * drift;
          p.ay += (Math.random() - 0.5) * drift;

          // 应用加速度
          p.vx += p.ax;
          p.vy += p.ay;
          p.ax = 0;
          p.ay = 0;

          // 速度衰减（略弱，保留更多动能）
          p.vx *= 0.99;
          p.vy *= 0.99;

          // 速度钳制
          const v = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
          const maxV = speedFactor * 3;
          if (v > maxV) {
            p.vx = (p.vx / v) * maxV;
            p.vy = (p.vy / v) * maxV;
          }

          // 位置更新
          p.x += p.vx;
          p.y += p.vy;

          // 边界回弹
          if (p.x < 0) { p.x = 0; p.vx *= -0.5; }
          if (p.x > w) { p.x = w; p.vx *= -0.5; }
          if (p.y < 0) { p.y = 0; p.vy *= -0.5; }
          if (p.y > h) { p.y = h; p.vy *= -0.5; }
        }

        // ─── 绘制 ───
        if (TRAIL_MODE) {
          // 拖尾淡影：半透明覆盖
          ctx.fillStyle = 'rgba(10,10,15,0.12)';
          ctx.fillRect(0, 0, w, h);
        } else {
          ctx.clearRect(0, 0, w, h);
        }

        const scheme = colorSchemes[COLOR_SCHEME];

        // 先画连线（在粒子下面）
        ctx.lineWidth = 0.6;
        for (let i = 0; i < particles.length; i++) {
          for (let j = i + 1; j < particles.length; j++) {
            const a = particles[i], b = particles[j];
            const dx = a.x - b.x;
            const dy = a.y - b.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < CONNECT_DIST) {
              const alpha = (1 - dist / CONNECT_DIST) * 0.35;
              if (COLOR_SCHEME === 'rainbow') {
                const midHue = (a.hue + b.hue) / 2;
                ctx.strokeStyle = `hsla(${midHue}, 70%, 65%, ${alpha})`;
              } else {
                ctx.strokeStyle = `rgba(${scheme.r},${scheme.g},${scheme.b},${alpha})`;
              }
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }

        // 再画粒子点
        for (const p of particles) {
          if (COLOR_SCHEME === 'rainbow') {
            // 鼠标附近色相偏移
            let hue = p.baseHue;
            if (mouse.active) {
              const dx = mouse.x - p.x;
              const dy = mouse.y - p.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < CONNECT_DIST * 2) {
                hue = (hue + (1 - dist / (CONNECT_DIST * 2)) * 40) % 360;
              }
            }
            p.hue = hue;
            ctx.fillStyle = `hsla(${hue}, 70%, 65%, 0.9)`;
          } else {
            // 鼠标附近增亮
            let alpha = 0.75;
            let r = scheme.r, g = scheme.g, b = scheme.b;
            if (mouse.active) {
              const dx = mouse.x - p.x;
              const dy = mouse.y - p.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < CONNECT_DIST) {
                alpha = Math.min(1, 0.75 + (1 - dist / CONNECT_DIST) * 0.25);
                const glow = (1 - dist / CONNECT_DIST) * 0.4;
                r = Math.min(255, scheme.r + glow * 155);
                g = Math.min(255, scheme.g + glow * 55);
                b = Math.min(255, scheme.b + glow * 0);
              }
            }
            ctx.fillStyle = `rgba(${Math.round(r)},${Math.round(g)},${Math.round(b)},${alpha})`;
          }

          const size = p.size * (POINT_SIZE / 2);
          ctx.beginPath();
          ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(update);
      }

      // ─── 事件 ───
      canvas.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.active = true;
      });
      canvas.addEventListener('mouseleave', () => { mouse.active = false; });
      // 触摸支持
      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        mouse.x = e.touches[0].clientX;
        mouse.y = e.touches[0].clientY;
        mouse.active = true;
      }, { passive: false });
      canvas.addEventListener('touchend', () => { mouse.active = false; });

      window.addEventListener('resize', resize);

      // ─── 控制面板 ───
      function syncPanel() {
        document.getElementById('countInput').value = PARTICLE_COUNT;
        document.getElementById('countSlider').value = PARTICLE_COUNT;
        document.getElementById('distSlider').value = CONNECT_DIST;
        document.getElementById('forceSlider').value = MOUSE_FORCE;
        document.getElementById('speedSlider').value = Math.round(BASE_SPEED * 100);
        document.getElementById('driftSlider').value = Math.round(DRIFT_FORCE * 100);
        document.getElementById('sizeSlider').value = POINT_SIZE;
        document.getElementById('colorSelect').value = COLOR_SCHEME;
        document.getElementById('trailCheck').checked = TRAIL_MODE;
      }

      function applySettings() {
        CONNECT_DIST = Number(document.getElementById('distSlider').value);
        MOUSE_FORCE = Number(document.getElementById('forceSlider').value);
        BASE_SPEED = Number(document.getElementById('speedSlider').value) / 100;
        DRIFT_FORCE = Number(document.getElementById('driftSlider').value) / 100;
        POINT_SIZE = Number(document.getElementById('sizeSlider').value);
        COLOR_SCHEME = document.getElementById('colorSelect').value;
        TRAIL_MODE = document.getElementById('trailCheck').checked;

        const newCount = Number(document.getElementById('countInput').value);
        if (newCount !== PARTICLE_COUNT) {
          PARTICLE_COUNT = newCount;
          particles = createParticles(PARTICLE_COUNT);
        }
        syncPanel();
      }

      document.getElementById('countSlider').addEventListener('input', function () {
        document.getElementById('countInput').value = this.value;
        applySettings();
      });
      document.getElementById('countInput').addEventListener('change', function () {
        let v = Number(this.value);
        v = Math.max(30, Math.min(300, v));
        this.value = v;
        document.getElementById('countSlider').value = v;
        applySettings();
      });
      document.getElementById('distSlider').addEventListener('input', applySettings);
      document.getElementById('forceSlider').addEventListener('input', applySettings);
      document.getElementById('speedSlider').addEventListener('input', applySettings);
      document.getElementById('driftSlider').addEventListener('input', applySettings);
      document.getElementById('sizeSlider').addEventListener('input', function () {
        applySettings();
        // 更新粒子大小
        for (const p of particles) {
          p.size = POINT_SIZE + Math.random() * 1.5;
        }
      });
      document.getElementById('colorSelect').addEventListener('change', applySettings);
      document.getElementById('trailCheck').addEventListener('change', applySettings);

      // 双击显示/隐藏面板
      canvas.addEventListener('dblclick', () => {
        document.getElementById('panel').classList.toggle('visible');
      });

      // ─── 启动 ───
      resize();
      particles = createParticles(PARTICLE_COUNT);
      syncPanel();
      requestAnimationFrame(update);
    })();
  </script>
</body>

</html>
